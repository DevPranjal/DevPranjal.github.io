<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <title>DSA Atlas - Interview Concepts & Patterns</title>
  <meta name="description" content="A visual, interview-focused atlas of data structures, algorithms, and problem-solving patterns.">
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    a { color: var(--cp-link); }
    :focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 2px; }

    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 260px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      background: var(--cp-bg-elevated); border-right: 1px solid var(--cp-border);
      padding: 24px 16px; display: flex; flex-direction: column; gap: 24px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center;
      border: 1px solid var(--cp-border-strong); border-radius: 10px;
      background: var(--cp-text); color: var(--cp-bg); font-family: Consolas, "Courier New", Courier, monospace;
      font-weight: 800; letter-spacing: 0;
    }
    .brand-name { font-size: 18px; font-weight: 750; letter-spacing: 0; }
    .brand-subtitle { color: var(--cp-text-muted); font-size: 12px; }
    .nav-list, .topic-list { display: grid; gap: 4px; }
    .nav-button, .topic-button {
      width: 100%; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px;
      text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .nav-button:hover, .topic-button:hover { background: var(--cp-surface-soft); }
    .nav-button.active { background: var(--cp-accent-soft); color: var(--cp-accent); font-weight: 700; }
    .nav-kicker, .section-label {
      color: var(--cp-text-muted); font-size: 11px; font-weight: 800; letter-spacing: .08em;
      text-transform: uppercase; padding: 0 12px; margin-bottom: 8px;
    }
    .count { color: var(--cp-text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .progress-panel { margin-top: auto; border-top: 1px solid var(--cp-border); padding: 20px 8px 0; }
    .progress-copy { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: var(--cp-text-muted); }
    .progress-track { height: 5px; background: var(--cp-border); overflow: hidden; border-radius: 8px; }
    .progress-fill { height: 100%; background: var(--cp-accent); transition: width .35s ease; }

    .main { min-width: 0; }
    .topbar {
      position: sticky; top: 0; z-index: 20; min-height: 68px; display: flex; align-items: center; gap: 12px;
      padding: 12px clamp(20px, 4vw, 56px); background: var(--cp-overlay); border-bottom: 1px solid var(--cp-border);
      backdrop-filter: blur(14px);
    }
    .search-button {
      flex: 1; max-width: 620px; min-width: 0; height: 42px; border: 1px solid var(--cp-border);
      border-radius: 10px; background: var(--cp-surface); color: var(--cp-text-muted); padding: 0 14px;
      display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    }
    .search-button:hover { border-color: var(--cp-border-strong); }
    kbd { font: 11px Consolas, "Courier New", Courier, monospace; border: 1px solid var(--cp-border); background: var(--cp-surface-soft); border-radius: 4px; padding: 2px 6px; }
    .icon-button {
      width: 42px; height: 42px; flex: 0 0 auto; border: 1px solid var(--cp-border); border-radius: 10px;
      background: var(--cp-surface); cursor: pointer; display: grid; place-items: center; font-weight: 800;
    }
    .icon-button:hover { border-color: var(--cp-border-strong); background: var(--cp-surface-soft); }
    .mobile-menu { display: none; }

    .view { width: min(1180px, 100%); margin: 0 auto; padding: 48px clamp(20px, 4vw, 56px) 80px; }
    .eyebrow { color: var(--cp-accent); font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    h1, h2, h3 { margin-top: 0; letter-spacing: 0; line-height: 1.12; }
    h1 { max-width: 800px; margin-bottom: 16px; font-size: clamp(36px, 6vw, 72px); font-weight: 800; }
    h2 { font-size: 27px; }
    h3 { font-size: 17px; }
    .lede { max-width: 720px; font-size: 18px; color: var(--cp-text-soft); }
    .page-intro { margin-bottom: 44px; animation: rise .45s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: 1px solid var(--cp-border); margin: 40px 0 48px; }
    .stat { padding: 18px 20px; border-right: 1px solid var(--cp-border); }
    .stat:first-child { padding-left: 0; }
    .stat:last-child { border-right: 0; }
    .stat-value { display: block; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat-label { color: var(--cp-text-muted); font-size: 12px; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 40px 0 18px; }
    .section-heading h2 { margin-bottom: 0; }
    .section-heading p { margin: 0; color: var(--cp-text-muted); }

    .category-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .category-card, .concept-card, .pattern-card {
      border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 8px;
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border); cursor: pointer;
      transition: transform .18s ease, border-color .18s ease;
    }
    .category-card:hover, .concept-card:hover, .pattern-card:hover { transform: translateY(-2px); border-color: var(--cp-border-strong); }
    .category-card { min-height: 190px; padding: 22px; display: flex; flex-direction: column; }
    .category-index { font: 12px Consolas, "Courier New", Courier, monospace; color: var(--cp-accent); }
    .category-card h3 { margin: 30px 0 8px; font-size: 22px; }
    .category-card p { margin: 0; color: var(--cp-text-muted); }
    .category-footer { margin-top: auto; padding-top: 20px; display: flex; justify-content: space-between; font-size: 12px; color: var(--cp-text-muted); }
    .concept-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .concept-card { padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 12px; }
    .concept-card h3 { margin-bottom: 5px; }
    .concept-card p { margin: 0; color: var(--cp-text-muted); font-size: 13px; }
    .difficulty { align-self: start; font: 10px Consolas, "Courier New", Courier, monospace; color: var(--cp-text-muted); text-transform: uppercase; }
    .mastered-dot { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--cp-success); }

    .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 24px; }
    .filter-row, .lab-menu, .visual-stage { scrollbar-width: none; overscroll-behavior-inline: contain; }
    .filter-row::-webkit-scrollbar, .lab-menu::-webkit-scrollbar, .visual-stage::-webkit-scrollbar { display: none; }
    .chip { border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 999px; padding: 7px 12px; white-space: nowrap; cursor: pointer; }
    .chip.active { background: var(--cp-text); color: var(--cp-bg); border-color: var(--cp-text); }

    .detail-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; border-bottom: 1px solid var(--cp-border); padding-bottom: 32px; margin-bottom: 28px; }
    .detail-header h1 { font-size: clamp(38px, 6vw, 68px); margin-top: 8px; }
    .detail-actions { display: flex; gap: 8px; align-items: start; }
    .button {
      min-height: 40px; border: 1px solid var(--cp-border); border-radius: 8px; padding: 8px 14px;
      background: var(--cp-surface); cursor: pointer; font-weight: 700;
    }
    .button:hover { border-color: var(--cp-border-strong); }
    .button.primary { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
    .button.primary:hover { background: var(--cp-accent-hover); }
    .detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; align-items: start; }
    .prose-section { margin-bottom: 36px; }
    .prose-section > p { color: var(--cp-text-soft); font-size: 16px; }
    .callout { border-left: 3px solid var(--cp-accent); background: var(--cp-accent-soft); padding: 16px 18px; margin: 20px 0; }
    .callout strong { display: block; margin-bottom: 4px; }
    .complexity-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .complexity-table th, .complexity-table td { border-bottom: 1px solid var(--cp-border); padding: 11px 8px; text-align: left; }
    .complexity-table th { color: var(--cp-text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    code, pre { font-family: Consolas, "Courier New", Courier, monospace; }
    pre { margin: 0; padding: 20px; overflow: auto; background: var(--cp-bg-elevated); border: 1px solid var(--cp-border); border-radius: 8px; line-height: 1.65; font-size: 13px; tab-size: 4; }
    .side-panel { position: sticky; top: 92px; display: grid; gap: 12px; }
    .info-panel { border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 8px; padding: 18px; }
    .info-panel h3 { margin-bottom: 12px; }
    .clean-list { margin: 0; padding-left: 18px; color: var(--cp-text-soft); }
    .clean-list li + li { margin-top: 8px; }
    .confidence { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .confidence button { border: 1px solid var(--cp-border); background: var(--cp-surface-soft); padding: 8px 4px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .confidence button.active { border-color: var(--cp-accent); color: var(--cp-accent); background: var(--cp-accent-soft); font-weight: 800; }

    .pattern-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .pattern-card { min-height: 230px; padding: 20px; display: flex; flex-direction: column; }
    .pattern-number { color: var(--cp-accent); font: 12px Consolas, "Courier New", Courier, monospace; }
    .pattern-card h3 { font-size: 20px; margin: 20px 0 8px; }
    .pattern-card p { color: var(--cp-text-muted); margin: 0; }
    .signal-list { margin-top: auto; padding-top: 18px; display: flex; flex-wrap: wrap; gap: 5px; }
    .signal { font-size: 11px; background: var(--cp-surface-soft); border-radius: 4px; padding: 3px 6px; color: var(--cp-text-muted); }
    .pattern-detail { border-top: 1px solid var(--cp-border); padding-top: 28px; margin-top: 32px; }
    .pattern-flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 24px 0 36px; }
    .flow-step { min-height: 108px; padding: 14px; border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 8px; }
    .flow-step span { color: var(--cp-accent); font: 11px Consolas, "Courier New", Courier, monospace; }
    .flow-step strong { display: block; margin-top: 12px; }

    .lab-shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 620px; border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 8px; overflow: hidden; }
    .lab-menu { border-right: 1px solid var(--cp-border); background: var(--cp-bg-elevated); padding: 14px; }
    .lab-menu button { width: 100%; border: 0; background: transparent; padding: 12px; border-radius: 7px; text-align: left; cursor: pointer; }
    .lab-menu button:hover { background: var(--cp-surface-soft); }
    .lab-menu button.active { background: var(--cp-accent-soft); color: var(--cp-accent); font-weight: 800; }
    .lab-main { min-width: 0; display: grid; grid-template-rows: auto 1fr auto; }
    .lab-toolbar { padding: 14px 18px; border-bottom: 1px solid var(--cp-border); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .lab-toolbar label { color: var(--cp-text-muted); font-size: 12px; }
    .lab-toolbar input, .lab-toolbar select { border: 1px solid var(--cp-border); background: var(--cp-surface); color: var(--cp-text); border-radius: 7px; padding: 8px 10px; min-width: 90px; }
    .visual-stage { min-height: 420px; padding: 28px; display: grid; place-items: center; overflow: auto; }
    .array-viz { display: flex; align-items: end; justify-content: center; gap: 8px; min-width: max-content; }
    .array-cell { display: grid; gap: 8px; justify-items: center; }
    .cell-value { width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid var(--cp-border-strong); border-radius: 6px; background: var(--cp-surface); font: 700 14px Consolas, "Courier New", Courier, monospace; transition: .2s ease; }
    .array-cell.active .cell-value { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); transform: translateY(-7px); }
    .array-cell.success .cell-value { background: var(--cp-success); color: var(--cp-accent-fg); border-color: var(--cp-success); }
    .array-cell.dim .cell-value { opacity: .35; }
    .cell-index { color: var(--cp-text-muted); font: 10px Consolas, "Courier New", Courier, monospace; }
    .bar-viz { height: 300px; display: flex; align-items: end; gap: 8px; min-width: 440px; }
    .bar { flex: 1; min-width: 24px; background: var(--cp-border-strong); border-radius: 4px 4px 0 0; transition: height .25s ease, background .2s ease; position: relative; }
    .bar.active { background: var(--cp-accent); }
    .bar.success { background: var(--cp-success); }
    .bar span { position: absolute; width: 100%; top: -24px; text-align: center; font: 11px Consolas, "Courier New", Courier, monospace; }
    .graph-viz { position: relative; width: min(560px, 78vw); height: 350px; }
    .edge { position: absolute; height: 2px; background: var(--cp-border-strong); transform-origin: left center; z-index: 0; }
    .node { position: absolute; width: 52px; height: 52px; margin: -26px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--cp-border-strong); background: var(--cp-surface); font-weight: 800; z-index: 1; transition: .2s ease; }
    .node.frontier { border-color: var(--cp-warning); background: var(--cp-surface-soft); }
    .node.visited { border-color: var(--cp-success); background: var(--cp-success); color: var(--cp-accent-fg); }
    .node.current { border-color: var(--cp-accent); background: var(--cp-accent); color: var(--cp-accent-fg); transform: scale(1.12); }
    .lab-status { border-top: 1px solid var(--cp-border); padding: 14px 18px; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
    .status-message { min-width: 0; }
    .status-message strong { display: block; }
    .status-message span { color: var(--cp-text-muted); font-size: 12px; }
    .transport { display: flex; gap: 6px; }
    .transport button { width: 38px; height: 38px; border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 7px; cursor: pointer; font-weight: 800; }
    .transport button:hover { background: var(--cp-surface-soft); }
    .transport button:disabled { opacity: .4; cursor: not-allowed; }

    .empty-state { max-width: 500px; margin: 80px auto; text-align: center; }
    .empty-state h2 { font-size: 36px; }
    .empty-state p { color: var(--cp-text-muted); }

    .dialog-backdrop { position: fixed; inset: 0; z-index: 100; display: none; place-items: start center; padding: 10vh 16px 16px; background: var(--cp-overlay); backdrop-filter: blur(6px); }
    .dialog-backdrop.open { display: grid; }
    .search-dialog { width: min(680px, 100%); max-height: 76vh; overflow: hidden; background: var(--cp-panel-strong); border: 1px solid var(--cp-border-strong); border-radius: 10px; box-shadow: var(--cp-shadow); }
    .search-input { width: 100%; border: 0; border-bottom: 1px solid var(--cp-border); background: transparent; color: var(--cp-text); padding: 20px; font-size: 18px; outline: 0; }
    .search-results { max-height: 58vh; overflow-y: auto; padding: 8px; }
    .search-result { width: 100%; border: 0; background: transparent; padding: 12px; border-radius: 7px; text-align: left; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 12px; }
    .search-result:hover, .search-result.selected { background: var(--cp-accent-soft); }
    .search-result strong { display: block; }
    .search-result small { color: var(--cp-text-muted); }
    .result-kind { color: var(--cp-accent); font: 10px Consolas, "Courier New", Courier, monospace; text-transform: uppercase; }
    .search-help { padding: 10px 16px; border-top: 1px solid var(--cp-border); color: var(--cp-text-muted); font-size: 11px; }
    .toast { position: fixed; z-index: 120; right: 20px; bottom: 20px; background: var(--cp-text); color: var(--cp-bg); border-radius: 8px; padding: 10px 14px; transform: translateY(80px); opacity: 0; transition: .25s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .mobile-nav { display: none; }

    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: fixed; z-index: 80; left: 0; width: 270px; transform: translateX(-100%); transition: transform .25s ease; box-shadow: var(--cp-shadow); }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu { display: grid; }
      .main { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
      .topbar { min-height: 60px; }
      .mobile-nav {
        position: fixed; z-index: 70; left: 0; right: 0; bottom: 0;
        display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
        background: var(--cp-panel-strong); border-top: 1px solid var(--cp-border);
        backdrop-filter: blur(16px);
      }
      .mobile-nav button {
        min-width: 0; min-height: 52px; border: 0; border-radius: 7px; background: transparent;
        color: var(--cp-text-muted); cursor: pointer; display: grid; place-items: center; align-content: center;
        gap: 2px; font-size: 10px; line-height: 1.1;
      }
      .mobile-nav button span:first-child { font: 700 17px Consolas, "Courier New", Courier, monospace; }
      .mobile-nav button.active { color: var(--cp-accent); background: var(--cp-accent-soft); font-weight: 800; }
      .category-grid, .pattern-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-layout { grid-template-columns: 1fr; }
      .side-panel { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .lab-shell { grid-template-columns: 1fr; }
      .lab-menu { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--cp-border); }
      .lab-menu button { width: auto; min-width: max-content; }
      .complexity-table { display: block; overflow-x: auto; white-space: nowrap; }
      pre { max-width: calc(100vw - 40px); }
    }
    @media (max-width: 620px) {
      .view { padding: 28px 16px 48px; }
      .topbar { padding-inline: 14px; }
      .search-button { height: 40px; }
      .search-button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .search-button kbd { display: none; }
      .icon-button { width: 40px; height: 40px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .stat { padding: 14px 12px; }
      .stat:nth-child(2) { border-right: 0; }
      .stat:nth-child(-n+2) { border-bottom: 1px solid var(--cp-border); }
      .category-grid, .concept-grid, .pattern-grid { grid-template-columns: 1fr; }
      .category-card { min-height: 160px; }
      .concept-card { min-height: 92px; }
      .detail-header { grid-template-columns: 1fr; }
      .detail-header h1 { font-size: 38px; overflow-wrap: anywhere; }

      return `<article class="concept-card" data-concept="${item.id}" tabindex="0"><div><h3>${item.title}</h3><p>${item.summary}</p></div>${solid ? '<span class="mastered-dot" title="Solid confidence"></span>' : `<span class="difficulty">${item.level}</span>`}</article>`;
    }

    function bindCards() {
      document.querySelectorAll('[data-concept]').forEach(card => {
        const open = () => setView('library', { detail:card.dataset.concept });
        card.addEventListener('click', open);
        card.addEventListener('keydown', event => { if (event.key === 'Enter') open(); });
      });
      document.querySelectorAll('[data-open-group]').forEach(card => {
        const open = () => { state.group = card.dataset.openGroup; renderLibrary(); window.scrollTo(0, 0); };
        card.addEventListener('click', open);
        card.addEventListener('keydown', event => { if (event.key === 'Enter') open(); });
      });
    }

    function renderConcept(id) {
      const item = concepts.find(entry => entry.id === id);
      if (!item) return setView('library');
      const saved = state.saved.has(id);
      const confidence = state.confidence[id] || '';
      viewElement.innerHTML = `
        <button class="button" id="back-library">&larr; Library</button>
        <header class="detail-header">
          <div><div class="eyebrow">${item.group} / ${item.level}</div><h1>${item.title}</h1><p class="lede">${item.summary}</p></div>
          <div class="detail-actions"><button class="button ${saved ? 'primary' : ''}" id="save-concept">${saved ? 'Saved' : 'Save'}</button></div>
        </header>
        <div class="detail-layout">
          <article>
            <section class="prose-section"><h2>Mental model</h2><p>${item.mental}</p><div class="callout"><strong>Interview move</strong>Start by naming the invariant and the information each operation must preserve.</div></section>
            <section class="prose-section"><h2>Complexity ledger</h2><table class="complexity-table"><thead><tr><th>Operation</th><th>Time</th><th>Extra space</th></tr></thead><tbody>${item.complexity.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></section>
            <section class="prose-section"><h2>Python template</h2><pre><code>${escapeHtml(item.code)}</code></pre></section>
          </article>
          <aside class="side-panel">
            <div class="info-panel"><h3>Recognition cues</h3><ul class="clean-list">${item.signals.map(signal => `<li>${signal}</li>`).join('')}</ul></div>
            <div class="info-panel"><h3>Common failure modes</h3><ul class="clean-list">${item.pitfalls.map(pitfall => `<li>${pitfall}</li>`).join('')}</ul></div>
            <div class="info-panel"><h3>Your confidence</h3><div class="confidence">${[['learning','Learning'],['review','Review'],['solid','Solid']].map(([value,label]) => `<button data-confidence="${value}" class="${confidence === value ? 'active' : ''}">${label}</button>`).join('')}</div></div>
          </aside>
        </div>`;
      document.getElementById('back-library').addEventListener('click', () => { state.detail = null; renderLibrary(); });
      document.getElementById('save-concept').addEventListener('click', () => {
        state.saved.has(id) ? state.saved.delete(id) : state.saved.add(id); persist(); renderConcept(id); showToast(state.saved.has(id) ? 'Saved for review' : 'Removed from saved');
      });
      document.querySelectorAll('[data-confidence]').forEach(button => button.addEventListener('click', () => {
        state.confidence[id] = button.dataset.confidence; persist(); renderConcept(id); showToast(`Confidence set to ${button.dataset.confidence}`);
      }));
    }

    function renderPatterns() {
      if (state.pattern) return renderPatternDetail(state.pattern);
      viewElement.innerHTML = `
        <section class="page-intro"><div class="eyebrow">Recognition before implementation</div><h1>Pattern atlas</h1><p class="lede">Patterns are compressed reasoning. Learn the signal, the invariant, and the point where each pattern stops working.</p></section>
        <div class="pattern-grid">${patterns.map((pattern, index) => `<article class="pattern-card" data-pattern="${index}" tabindex="0"><span class="pattern-number">${String(index + 1).padStart(2, '0')}</span><h3>${pattern.title}</h3><p>${pattern.summary}</p><div class="signal-list">${pattern.cues.map(cue => `<span class="signal">${cue}</span>`).join('')}</div></article>`).join('')}</div>`;
      document.querySelectorAll('[data-pattern]').forEach(card => {
        const open = () => { state.pattern = Number(card.dataset.pattern); renderPatterns(); window.scrollTo(0, 0); };
        card.addEventListener('click', open); card.addEventListener('keydown', event => { if (event.key === 'Enter') open(); });
      });
    }

    function renderPatternDetail(index) {
      const pattern = patterns[index];
      const related = concepts.find(item => item.id === pattern.id);
      viewElement.innerHTML = `
        <button class="button" id="back-patterns">&larr; Pattern atlas</button>
        <section class="page-intro" style="margin-top:32px"><div class="eyebrow">Pattern ${String(index + 1).padStart(2, '0')}</div><h1>${pattern.title}</h1><p class="lede">${pattern.summary}</p></section>
        <div class="pattern-flow">${pattern.steps.map((step, stepIndex) => `<div class="flow-step"><span>0${stepIndex + 1}</span><strong>${step}</strong></div>`).join('')}</div>
        <div class="detail-layout pattern-detail"><article><section class="prose-section"><h2>Recognition cues</h2><p>${pattern.cues.map(cue => `<span class="signal">${cue}</span>`).join(' ')}</p></section><section class="prose-section"><h2>When not to use it</h2><div class="callout"><strong>Boundary of the pattern</strong>${pattern.avoid}</div></section>${related ? `<section class="prose-section"><h2>Canonical template</h2><pre><code>${escapeHtml(related.code)}</code></pre></section>` : ''}</article><aside class="side-panel"><div class="info-panel"><h3>Interview explanation</h3><ol class="clean-list"><li>Name the brute-force search space.</li><li>Identify the property that removes repeated work.</li><li>State the invariant before coding.</li><li>Close with time and space complexity.</li></ol></div></aside></div>`;
      document.getElementById('back-patterns').addEventListener('click', () => { state.pattern = null; renderPatterns(); });
    }

    function renderSaved() {
      const savedItems = concepts.filter(item => state.saved.has(item.id));
      const ratedItems = concepts.filter(item => state.confidence[item.id]);
      viewElement.innerHTML = `
        <section class="page-intro"><div class="eyebrow">Your local field notes</div><h1>Saved &amp; progress</h1><p class="lede">Bookmarks and confidence stay in this browser. No account, streak, or schedule required.</p></section>
        <div class="section-heading"><div><div class="eyebrow">Review queue</div><h2>Saved concepts</h2></div><p>${savedItems.length} saved</p></div>
        ${savedItems.length ? `<div class="concept-grid">${savedItems.map(conceptCard).join('')}</div>` : `<div class="empty-state"><h2>Nothing saved yet.</h2><p>Save concepts you want to revisit and they will collect here.</p><button class="button primary" id="browse-button">Browse the library</button></div>`}
        ${ratedItems.length ? `<div class="section-heading"><div><div class="eyebrow">Self assessment</div><h2>Confidence map</h2></div><p>${ratedItems.length} rated</p></div><div class="concept-grid">${ratedItems.map(conceptCard).join('')}</div>` : ''}`;
      bindCards();
      document.getElementById('browse-button')?.addEventListener('click', () => setView('library'));
    }

    function buildBinarySteps(values, target) {
      const steps = [{ values, active:[], dim:[], message:'Search space initialized', note:`Target: ${target}` }];
      let left = 0, right = values.length - 1;
      while (left <= right) {
        const mid = Math.floor((left + right) / 2);
        steps.push({ values, active:[mid], dim:values.map((_,i)=>i).filter(i=>i<left||i>right), message:`Inspect index ${mid}`, note:`${values[mid]} compared with ${target}` });
        if (values[mid] === target) { steps.push({ values, success:[mid], dim:[], message:'Target found', note:`Index ${mid}` }); return steps; }
        if (values[mid] < target) { left = mid + 1; steps.push({ values, active:[], dim:values.map((_,i)=>i).filter(i=>i<left||i>right), message:'Discard the left half', note:`${values[mid]} is too small` }); }
        else { right = mid - 1; steps.push({ values, active:[], dim:values.map((_,i)=>i).filter(i=>i<left||i>right), message:'Discard the right half', note:`${values[mid]} is too large` }); }
      }
      steps.push({ values, active:[], dim:values.map((_,i)=>i), message:'Target is absent', note:'Search space is empty' }); return steps;
    }

    function buildSortSteps(values) {
      const array = [...values], steps = [{ values:[...array], active:[], message:'Insertion sort initialized', note:'The sorted prefix is initially one item.' }];
      for (let index = 1; index < array.length; index++) {
        const key = array[index]; let position = index - 1;
        steps.push({ values:[...array], active:[index], message:`Pick ${key} as the key`, note:'Insert it into the sorted prefix.' });
        while (position >= 0 && array[position] > key) {
          array[position + 1] = array[position];
          steps.push({ values:[...array], active:[position, position + 1], message:`Shift ${array[position]} right`, note:`It is larger than ${key}.` }); position--;
        }
        array[position + 1] = key;
        steps.push({ values:[...array], active:[position + 1], success:Array.from({length:index + 1},(_,i)=>i), message:`Place ${key}`, note:`First ${index + 1} values are sorted.` });
      }
      steps.push({ values:[...array], success:array.map((_,i)=>i), message:'Array sorted', note:'Every prefix invariant now covers the full array.' }); return steps;
    }

    const graphData = { A:['B','C'], B:['A','D','E'], C:['A','F'], D:['B'], E:['B','F'], F:['C','E'] };
    function buildGraphSteps(mode) {
      const frontier = ['A'], seen = new Set(['A']), steps = [{ current:null, frontier:['A'], visited:[], message:`${mode.toUpperCase()} initialized`, note:'A enters the frontier.' }];
      const visited = [];
      while (frontier.length) {
        const node = mode === 'bfs' ? frontier.shift() : frontier.pop(); visited.push(node);
        steps.push({ current:node, frontier:[...frontier], visited:[...visited], message:`Visit ${node}`, note:`Frontier: ${frontier.join(', ') || 'empty'}` });
        const neighbors = mode === 'bfs' ? graphData[node] : [...graphData[node]].reverse();
        neighbors.forEach(next => { if (!seen.has(next)) { seen.add(next); frontier.push(next); } });
        steps.push({ current:null, frontier:[...frontier], visited:[...visited], message:`Expand ${node}`, note:`Add unseen neighbors: ${frontier.join(', ') || 'none'}` });
      }
      return steps;
    }

    function buildWindowSteps(values, size) {
      const steps = [], safeSize = Math.max(1, Math.min(size, values.length)); let total = values.slice(0, safeSize).reduce((a,b)=>a+b,0), best = total;
      steps.push({ values, active:Array.from({length:safeSize},(_,i)=>i), message:`First window sum: ${total}`, note:`Best is ${best}` });
      for (let right=safeSize; right<values.length; right++) {
        total += values[right] - values[right-safeSize]; best = Math.max(best,total);
        steps.push({ values, active:Array.from({length:safeSize},(_,i)=>right-safeSize+1+i), message:`Slide right: sum ${total}`, note:`Remove ${values[right-safeSize]}, add ${values[right]}; best ${best}` });
      }
      steps.push({ values, active:[], success:[], message:`Maximum window sum: ${best}`, note:`Every size-${safeSize} window was evaluated in O(n).` }); return steps;
    }

    function renderLab() {
      const kinds = [['binary','Binary search'],['sort','Insertion sort'],['graph','BFS / DFS'],['window','Sliding window']];
      viewElement.innerHTML = `<section class="page-intro"><div class="eyebrow">Make the invariant visible</div><h1>Visualizer lab</h1><p class="lede">Step through state transitions. Pause at each frame and predict the next move before advancing.</p></section>
        <div class="lab-shell"><nav class="lab-menu" aria-label="Visualizer selection">${kinds.map(([id,label])=>`<button data-lab-kind="${id}" class="${state.lab.kind===id?'active':''}">${label}</button>`).join('')}</nav><section class="lab-main"><div class="lab-toolbar" id="lab-toolbar"></div><div class="visual-stage" id="visual-stage"></div><div class="lab-status"><div class="status-message" id="status-message"></div><div class="transport"><button id="lab-reset" title="Reset" aria-label="Reset">|&lt;</button><button id="lab-prev" title="Previous step" aria-label="Previous step">&lt;</button><button id="lab-play" title="Play or pause" aria-label="Play or pause">&#9654;</button><button id="lab-next" title="Next step" aria-label="Next step">&gt;</button></div></div></section></div>`;
      document.querySelectorAll('[data-lab-kind]').forEach(button => button.addEventListener('click', () => { state.lab.kind=button.dataset.labKind; state.lab.index=0; renderLab(); }));
      initializeLab();
    }

    function initializeLab() {
      const toolbar = document.getElementById('lab-toolbar');
      if (state.lab.kind === 'binary') toolbar.innerHTML = `<label>Sorted values <input id="lab-values" value="2, 5, 8, 12, 16, 23, 38"></label><label>Target <input id="lab-target" type="number" value="23"></label><button class="button primary" id="lab-build">Run</button>`;
      if (state.lab.kind === 'sort') toolbar.innerHTML = `<label>Values <input id="lab-values" value="7, 3, 9, 2, 6, 1"></label><button class="button primary" id="lab-build">Sort</button>`;
      if (state.lab.kind === 'graph') toolbar.innerHTML = `<label>Traversal <select id="lab-mode"><option value="bfs">Breadth-first</option><option value="dfs">Depth-first</option></select></label><button class="button primary" id="lab-build">Traverse</button>`;
      if (state.lab.kind === 'window') toolbar.innerHTML = `<label>Values <input id="lab-values" value="2, 1, 5, 1, 3, 2"></label><label>Window <input id="lab-size" type="number" min="1" value="3"></label><button class="button primary" id="lab-build">Slide</button>`;
      document.getElementById('lab-build').addEventListener('click', rebuildLab);
      document.getElementById('lab-reset').addEventListener('click', () => setLabStep(0));
      document.getElementById('lab-prev').addEventListener('click', () => setLabStep(state.lab.index - 1));
      document.getElementById('lab-next').addEventListener('click', () => setLabStep(state.lab.index + 1));
      document.getElementById('lab-play').addEventListener('click', toggleLabPlay);
      rebuildLab();
    }

    function parseValues() { return document.getElementById('lab-values').value.split(',').map(value=>Number(value.trim())).filter(Number.isFinite).slice(0, 12); }
    function rebuildLab() {
      clearInterval(state.lab.timer); state.lab.index = 0;
      if (state.lab.kind === 'binary') state.lab.steps = buildBinarySteps(parseValues().sort((a,b)=>a-b), Number(document.getElementById('lab-target').value));
      if (state.lab.kind === 'sort') state.lab.steps = buildSortSteps(parseValues());
      if (state.lab.kind === 'graph') state.lab.steps = buildGraphSteps(document.getElementById('lab-mode').value);
      if (state.lab.kind === 'window') state.lab.steps = buildWindowSteps(parseValues(), Number(document.getElementById('lab-size').value));
      drawLab();
    }

    function setLabStep(index) { state.lab.index = Math.max(0, Math.min(index, state.lab.steps.length - 1)); drawLab(); }
    function toggleLabPlay() {
      if (state.lab.timer) { clearInterval(state.lab.timer); state.lab.timer = null; drawLab(); return; }
      if (state.lab.index === state.lab.steps.length - 1) state.lab.index = 0;
      state.lab.timer = setInterval(() => { if (state.lab.index >= state.lab.steps.length - 1) { clearInterval(state.lab.timer); state.lab.timer=null; drawLab(); } else setLabStep(state.lab.index + 1); }, 800);
      drawLab();
    }

    function drawLab() {
      const step = state.lab.steps[state.lab.index]; if (!step) return;
      const stage = document.getElementById('visual-stage');
      if (state.lab.kind === 'binary' || state.lab.kind === 'window') {
        stage.innerHTML = `<div class="array-viz">${step.values.map((value,index)=>`<div class="array-cell ${(step.active||[]).includes(index)?'active':''} ${(step.success||[]).includes(index)?'success':''} ${(step.dim||[]).includes(index)?'dim':''}"><div class="cell-value">${value}</div><div class="cell-index">${index}</div></div>`).join('')}</div>`;
      } else if (state.lab.kind === 'sort') {
        const maximum = Math.max(...step.values, 1);
        stage.innerHTML = `<div class="bar-viz">${step.values.map((value,index)=>`<div class="bar ${(step.active||[]).includes(index)?'active':''} ${(step.success||[]).includes(index)?'success':''}" style="height:${Math.max(8,value/maximum*90)}%"><span>${value}</span></div>`).join('')}</div>`;
      } else {
        const positions = {A:[50,12],B:[22,38],C:[78,38],D:[10,75],E:[39,78],F:[78,75]}, edges=[['A','B'],['A','C'],['B','D'],['B','E'],['C','F'],['E','F']];
        stage.innerHTML = `<div class="graph-viz">${edges.map(([a,b])=>{const [ax,ay]=positions[a],[bx,by]=positions[b],dx=bx-ax,dy=by-ay,length=Math.sqrt(dx*dx+dy*dy),angle=Math.atan2(dy,dx)*180/Math.PI;return `<span class="edge" style="left:${ax}%;top:${ay}%;width:${length}%;transform:rotate(${angle}deg)"></span>`}).join('')}${Object.entries(positions).map(([node,[x,y]])=>`<span class="node ${step.current===node?'current':(step.frontier||[]).includes(node)?'frontier':(step.visited||[]).includes(node)?'visited':''}" style="left:${x}%;top:${y}%">${node}</span>`).join('')}</div>`;
      }
      document.getElementById('status-message').innerHTML = `<strong>${step.message}</strong><span>Step ${state.lab.index + 1} of ${state.lab.steps.length} / ${step.note}</span>`;
      document.getElementById('lab-prev').disabled = state.lab.index === 0;
      document.getElementById('lab-next').disabled = state.lab.index === state.lab.steps.length - 1;
      document.getElementById('lab-play').innerHTML = state.lab.timer ? '&#10074;&#10074;' : '&#9654;';
    }

    function openSearch() {
      document.getElementById('search-backdrop').classList.add('open');
      const input = document.getElementById('search-input'); input.value=''; renderSearch(''); setTimeout(()=>input.focus(),0);
    }
    function closeSearch() { document.getElementById('search-backdrop').classList.remove('open'); }
    function renderSearch(query) {
      const normalized = query.trim().toLowerCase();
      const conceptResults = concepts.filter(item => !normalized || [item.title,item.group,item.summary,...item.signals].join(' ').toLowerCase().includes(normalized)).slice(0,8).map(item=>({kind:'concept',title:item.title,subtitle:item.group,id:item.id}));
      const patternResults = patterns.filter(item => normalized && [item.title,item.summary,...item.cues].join(' ').toLowerCase().includes(normalized)).slice(0,4).map((item,index)=>({kind:'pattern',title:item.title,subtitle:item.cues.join(' / '),id:patterns.indexOf(item)}));
      const results = [...conceptResults,...patternResults];
      document.getElementById('search-results').innerHTML = results.length ? results.map((result,index)=>`<button class="search-result ${index===0?'selected':''}" data-result-kind="${result.kind}" data-result-id="${result.id}"><span><strong>${result.title}</strong><small>${result.subtitle}</small></span><span class="result-kind">${result.kind}</span></button>`).join('') : `<div class="empty-state" style="margin:32px auto"><p>No matching concepts or patterns.</p></div>`;
      document.querySelectorAll('.search-result').forEach(button=>button.addEventListener('click',()=>openResult(button)));
    }
    function openResult(button) { closeSearch(); button.dataset.resultKind==='concept' ? setView('library',{detail:button.dataset.resultId}) : setView('patterns',{pattern:Number(button.dataset.resultId)}); }
    function showToast(message) { const toast=document.getElementById('toast'); toast.textContent=message; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1800); }

    document.querySelectorAll('.nav-button').forEach(button => button.addEventListener('click', () => setView(button.dataset.view)));
    document.querySelectorAll('[data-mobile-view]').forEach(button => button.addEventListener('click', () => setView(button.dataset.mobileView)));
    document.getElementById('menu-button').addEventListener('click', () => sidebar.classList.toggle('open'));
    document.getElementById('search-button').addEventListener('click', openSearch);
    document.getElementById('search-backdrop').addEventListener('click', event => { if (event.target.id==='search-backdrop') closeSearch(); });
    document.getElementById('search-input').addEventListener('input', event => renderSearch(event.target.value));
    document.getElementById('search-input').addEventListener('keydown', event => {
      const items=[...document.querySelectorAll('.search-result')], selected=document.querySelector('.search-result.selected'); let index=items.indexOf(selected);
      if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();selected?.classList.remove('selected');index=(index+(event.key==='ArrowDown'?1:-1)+items.length)%items.length;items[index]?.classList.add('selected');items[index]?.scrollIntoView({block:'nearest'});}
      if(event.key==='Enter'&&selected) openResult(selected);
    });
    document.getElementById('theme-button').addEventListener('click', () => { const next=document.documentElement.dataset.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=next; });
    document.addEventListener('keydown', event => { if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openSearch();} if(event.key==='Escape')closeSearch(); });

    renderTopics(); render();
  </script>
</body>
