# Site Info
title:              "Pranjal Gulati"
description:        "Data Scientist at Microsoft working across applied AI, machine learning, and large-scale data systems."
author_name:        "Pranjal Gulati" # change this to your name

# Site Settings
url:                https://devpranjal.github.io
baseurl:            
permalink:          /writing/:title/ # Post permalink
timezone:           Asia/Kolkata
mathjax:            true  # enables support for mathjax - set to 'false' to disable
social_share_previews: true
google_analytics:   G-6K7BH5FMYB  # GA4 measurement id - only loads on production builds

# Site Build
highlighter:        rouge
markdown:           kramdown
kramdown:
    input:          GFM
sass:
    style:          :compressed

# Other Params
exclude:            [ "LICENSE", "README.md", "CNAME", "vendor", "Gemfile", "resume" ]
plugins:
  - jekyll-sitemap
  - jekyll-last-modified-at



defaults:
  -
    scope:
      path:         ""
    values:
      layout:       "null"
  -
    scope:
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      type:         "posts"
    values:
      layout:       "post"
