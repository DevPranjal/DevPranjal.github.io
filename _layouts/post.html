---
layout: default
---

<article class="article-shell">
	<header class="article-header">
		<a class="eyebrow-link" href="{{ '/writing/' | relative_url }}">Writing</a>
		<h1>{{ page.title }}</h1>
		<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
	</header>

	<div class="article-content">
		{{ content }}
	</div>

	<nav class="article-navigation" aria-label="Article navigation">
		{% if page.next.url %}
			<a href="{{ page.next.url | relative_url }}">&larr; {{ page.next.title }}</a>
		{% endif %}
		{% if page.previous.url %}
			<a href="{{ page.previous.url | relative_url }}">{{ page.previous.title }} &rarr;</a>
		{% endif %}
	</nav>
</article>
