---
layout: default
---

<article class="page-shell">
	<header class="page-header">
		<a class="back-link" href="{{ '/' | relative_url }}">&larr; Home</a>
		<h1>{{ page.title }}</h1>
		{% if page.description %}<p>{{ page.description }}</p>{% endif %}
	</header>
	<div class="page-content">
		{{ content }}
	</div>
</article>
