<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>
    (() => {
      let stored = null;
      try {
        stored = localStorage.getItem("llmi-theme");
        if (stored && stored.charAt(0) === '"') stored = JSON.parse(stored);
      } catch (e) { stored = null; }
      if (stored !== "dark" && stored !== "light") stored = null;
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = param || stored || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <title>Inference Atlas — LLM Inference &amp; Serving, End to End</title>
  <meta name="description" content="A complete, ordered, and deliberately hard curriculum for LLM inference: arithmetic, kernels, serving engines, quantization, speculative decoding, distributed serving, and unit economics. With papers, calculators, and drills.">
  <meta name="color-scheme" content="light dark">
  <meta property="og:title" content="Inference Atlas — LLM Inference &amp; Serving">
  <meta property="og:description" content="A complete, ordered curriculum for LLM inference and serving: theory, systems, kernels, engines, and economics.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/favicon.png">
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #b45309;
      --cp-info: #0f766e;
      --cp-link: #0060ac;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.82);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #969696;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-info: #5eead4;
      --cp-link: #7ab8ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel-strong: rgba(41, 41, 41, 0.97);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-width: 320px;
      background: var(--cp-bg); color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    a { color: var(--cp-link); text-underline-offset: 2px; }
    a:hover { color: var(--cp-accent); }
    :focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 2px; }
    ::selection { background: var(--cp-highlight); }

    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 272px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      background: var(--cp-bg-elevated); border-right: 1px solid var(--cp-border);
      padding: 24px 16px; display: flex; flex-direction: column; gap: 22px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
    .brand-mark {
      width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center;
      border: 1px solid var(--cp-border-strong); border-radius: 10px;
      background: var(--cp-text); color: var(--cp-bg);
      font: 800 12px Consolas, "Courier New", Courier, monospace;
    }
    .brand-name { font-size: 17px; font-weight: 750; }
    .brand-subtitle { color: var(--cp-text-muted); font-size: 12px; }
    .nav-list, .module-list { display: grid; gap: 3px; }
    .nav-button, .module-button {
      width: 100%; border: 0; background: transparent; padding: 9px 12px; border-radius: 8px;
      text-align: left; cursor: pointer; display: flex; justify-content: space-between;
      align-items: center; gap: 10px; min-width: 0;
    }
    .nav-button:hover, .module-button:hover { background: var(--cp-surface-soft); }
    .nav-button.active { background: var(--cp-accent-soft); color: var(--cp-accent); font-weight: 700; }
    .module-button.active { background: var(--cp-surface-soft); font-weight: 700; }
    .module-button span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-kicker, .section-label {
      color: var(--cp-text-muted); font-size: 11px; font-weight: 800; letter-spacing: .08em;
      text-transform: uppercase; padding: 0 12px; margin-bottom: 8px;
    }
    .count { color: var(--cp-text-muted); font: 12px Consolas, "Courier New", Courier, monospace; flex: 0 0 auto; }
    .progress-panel { margin-top: auto; border-top: 1px solid var(--cp-border); padding: 18px 8px 0; }
    .progress-copy { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: var(--cp-text-muted); }
    .progress-track { height: 5px; background: var(--cp-border); overflow: hidden; border-radius: 8px; }
    .progress-fill { height: 100%; background: var(--cp-accent); transition: width .35s ease; }
    .sidebar-foot { padding: 12px 8px 0; font-size: 11px; color: var(--cp-text-muted); }

    .main { min-width: 0; }
    .topbar {
      position: sticky; top: 0; z-index: 20; min-height: 68px; display: flex; align-items: center; gap: 10px;
      padding: 12px clamp(16px, 4vw, 56px); background: var(--cp-overlay);
      border-bottom: 1px solid var(--cp-border); backdrop-filter: blur(14px);
    }
    .search-button {
      flex: 1; max-width: 620px; min-width: 0; height: 42px; border: 1px solid var(--cp-border);
      border-radius: 10px; background: var(--cp-surface); color: var(--cp-text-muted); padding: 0 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer;
    }
    .search-button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-button:hover { border-color: var(--cp-border-strong); }
    kbd { font: 11px Consolas, "Courier New", Courier, monospace; border: 1px solid var(--cp-border); background: var(--cp-surface-soft); border-radius: 4px; padding: 2px 6px; }
    .icon-button {
      width: 42px; height: 42px; flex: 0 0 auto; border: 1px solid var(--cp-border); border-radius: 10px;
      background: var(--cp-surface); cursor: pointer; display: grid; place-items: center; font-weight: 800;
    }
    .icon-button:hover { border-color: var(--cp-border-strong); background: var(--cp-surface-soft); }
    .mobile-menu { display: none; }

    .view { width: min(1220px, 100%); margin: 0 auto; padding: 44px clamp(16px, 4vw, 56px) 96px; }
    .eyebrow { color: var(--cp-accent); font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    h1, h2, h3, h4 { margin-top: 0; line-height: 1.14; }
    h1 { max-width: 860px; margin-bottom: 16px; font-size: clamp(34px, 5.6vw, 66px); font-weight: 800; overflow-wrap: break-word; }
    h2 { font-size: 26px; }
    h3 { font-size: 17px; }
    h4 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--cp-text-muted); }
    .lede { max-width: 760px; font-size: 17px; color: var(--cp-text-soft); }
    .page-intro { margin-bottom: 36px; animation: rise .4s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: 1px solid var(--cp-border); margin: 34px 0 40px; }
    .stat { padding: 16px 20px; border-right: 1px solid var(--cp-border); min-width: 0; }
    .stat:first-child { padding-left: 0; }
    .stat:last-child { border-right: 0; }
    .stat-value { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat-label { color: var(--cp-text-muted); font-size: 12px; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 40px 0 16px; }
    .section-heading h2 { margin-bottom: 0; }
    .section-heading p { margin: 0; color: var(--cp-text-muted); font-size: 13px; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .card {
      border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 8px;
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
      transition: transform .18s ease, border-color .18s ease;
    }
    button.card { cursor: pointer; text-align: left; width: 100%; color: inherit; }
    button.card:hover { transform: translateY(-2px); border-color: var(--cp-border-strong); }
    .module-card { padding: 20px; display: flex; flex-direction: column; min-height: 208px; }
    .module-index { font: 12px Consolas, "Courier New", Courier, monospace; color: var(--cp-accent); }
    .module-card h3 { margin: 18px 0 8px; font-size: 21px; }
    .module-card p { margin: 0; color: var(--cp-text-muted); font-size: 13.5px; }
    .module-foot { margin-top: auto; padding-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--cp-text-muted); }
    .mini-track { flex: 1; height: 4px; background: var(--cp-border); border-radius: 8px; overflow: hidden; max-width: 110px; }
    .mini-fill { height: 100%; background: var(--cp-success); }

    .unit-list { display: grid; gap: 8px; }
    .unit-row {
      width: 100%; border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 8px;
      padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px;
      align-items: center; cursor: pointer; text-align: left; color: inherit;
      transition: border-color .16s ease, transform .16s ease;
    }
    .unit-row:hover { border-color: var(--cp-border-strong); transform: translateX(2px); }
    .unit-num { font: 700 12px Consolas, "Courier New", Courier, monospace; color: var(--cp-text-muted); min-width: 30px; }
    .unit-row.done .unit-num { color: var(--cp-success); }
    .unit-body { min-width: 0; }
    .unit-body strong { display: block; font-size: 15px; margin-bottom: 3px; }
    .unit-body span { color: var(--cp-text-muted); font-size: 13px; display: block; }
    .unit-meta { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }

    .tag {
      font: 10px Consolas, "Courier New", Courier, monospace; text-transform: uppercase; letter-spacing: .04em;
      border: 1px solid var(--cp-border); border-radius: 999px; padding: 3px 8px; color: var(--cp-text-muted);
      white-space: nowrap;
    }
    .tag.t1 { color: var(--cp-info); border-color: currentColor; }
    .tag.t2 { color: var(--cp-link); border-color: currentColor; }
    .tag.t3 { color: var(--cp-warning); border-color: currentColor; }
    .tag.t4 { color: var(--cp-accent); border-color: currentColor; }
    .tag.solid { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }

    .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 22px; scrollbar-width: none; overscroll-behavior-inline: contain; }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip { border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 999px; padding: 7px 13px; white-space: nowrap; cursor: pointer; font-size: 13px; flex: 0 0 auto; }
    .chip:hover { border-color: var(--cp-border-strong); }
    .chip.active { background: var(--cp-text); color: var(--cp-bg); border-color: var(--cp-text); font-weight: 700; }

    .detail-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; border-bottom: 1px solid var(--cp-border); padding-bottom: 26px; margin-bottom: 26px; }
    .detail-header h1 { font-size: clamp(30px, 4.6vw, 52px); margin: 10px 0 12px; }
    .detail-actions { display: flex; gap: 8px; align-items: start; flex-wrap: wrap; }
    .button {
      min-height: 40px; border: 1px solid var(--cp-border); border-radius: 8px; padding: 8px 14px;
      background: var(--cp-surface); cursor: pointer; font-weight: 700; font-size: 14px;
    }
    .button:hover { border-color: var(--cp-border-strong); }
    .button.primary { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
    .button.primary:hover { background: var(--cp-accent-hover); }
    .button.ghost { background: transparent; }
    .breadcrumb { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--cp-text-muted); }
    .breadcrumb button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--cp-accent); font-weight: 700; }

    .detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; align-items: start; }
    .detail-layout > * { min-width: 0; }
    .prose-section { margin-bottom: 34px; }
    .prose-section > p { color: var(--cp-text-soft); font-size: 15.5px; }
    .prose-section h2 { border-bottom: 1px solid var(--cp-border); padding-bottom: 8px; margin-bottom: 16px; }
    .callout { border-left: 3px solid var(--cp-accent); background: var(--cp-accent-soft); padding: 14px 16px; margin: 18px 0; border-radius: 0 6px 6px 0; }
    .callout strong { display: block; margin-bottom: 4px; }
    .callout.warn { border-left-color: var(--cp-warning); background: color-mix(in srgb, var(--cp-warning) 9%, transparent); }
    .callout.info { border-left-color: var(--cp-info); background: color-mix(in srgb, var(--cp-info) 9%, transparent); }

    table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13.5px; }
    table.data th, table.data td { border-bottom: 1px solid var(--cp-border); padding: 9px 8px; text-align: left; vertical-align: top; }
    table.data th { color: var(--cp-text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
    table.data td code { font-size: 12.5px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--cp-border); border-radius: 8px; padding: 4px 12px; background: var(--cp-surface); -webkit-overflow-scrolling: touch; }

    code, pre, .mono { font-family: Consolas, "Courier New", Courier, monospace; }
    code { background: var(--cp-surface-soft); border-radius: 4px; padding: 1px 5px; font-size: .92em; overflow-wrap: anywhere; }
    pre { margin: 0; padding: 16px; overflow: auto; background: var(--cp-bg-elevated); border: 1px solid var(--cp-border); border-radius: 8px; line-height: 1.6; font-size: 13px; tab-size: 2; -webkit-overflow-scrolling: touch; }
    pre code { background: none; padding: 0; font-size: inherit; }
    .formula {
      margin: 14px 0; border: 1px solid var(--cp-border); border-left: 3px solid var(--cp-accent);
      border-radius: 0 8px 8px 0; background: var(--cp-bg-elevated); overflow: hidden;
    }
    .formula-title { padding: 9px 14px; border-bottom: 1px solid var(--cp-border); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--cp-text-muted); }
    .formula pre { border: 0; border-radius: 0; background: transparent; padding: 14px; font-size: 13px; }
    .formula-note { padding: 0 14px 12px; color: var(--cp-text-muted); font-size: 13px; }

    .side-panel { position: sticky; top: 92px; display: grid; gap: 12px; }
    .info-panel { border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 8px; padding: 16px; }
    .info-panel h3 { margin-bottom: 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--cp-text-muted); }
    .clean-list { margin: 0; padding-left: 18px; color: var(--cp-text-soft); }
    .clean-list li + li { margin-top: 8px; }
    .plain-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }

    .res-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--cp-border); }
    .res-item:last-child { border-bottom: 0; }
    .res-kind {
      font: 9px Consolas, "Courier New", Courier, monospace; text-transform: uppercase; letter-spacing: .05em;
      border: 1px solid var(--cp-border); border-radius: 4px; padding: 3px 5px; height: max-content;
      color: var(--cp-text-muted); min-width: 52px; text-align: center; white-space: nowrap;
    }
    .res-kind.paper { color: var(--cp-accent); border-color: currentColor; }
    .res-kind.video { color: var(--cp-warning); border-color: currentColor; }
    .res-kind.code { color: var(--cp-success); border-color: currentColor; }
    .res-kind.docs { color: var(--cp-info); border-color: currentColor; }
    .res-body { min-width: 0; }
    .res-body a { font-weight: 650; overflow-wrap: anywhere; }
    .res-body p { margin: 3px 0 0; color: var(--cp-text-muted); font-size: 13px; }
    .res-src { color: var(--cp-text-muted); font-size: 12px; }
    .star { color: var(--cp-accent); font-weight: 800; }

    .drill { border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
    .drill-head { width: 100%; border: 0; background: transparent; padding: 15px 16px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: start; cursor: pointer; text-align: left; color: inherit; }
    .drill-head:hover { background: var(--cp-surface-soft); }
    .drill-q { font-weight: 650; font-size: 14.5px; }
    .drill-idx { font: 700 12px Consolas, "Courier New", Courier, monospace; color: var(--cp-text-muted); }
    .drill-toggle { font: 700 16px Consolas, monospace; color: var(--cp-accent); }
    .drill-body { padding: 0 16px 16px; border-top: 1px solid var(--cp-border); }
    .drill-body > *:first-child { margin-top: 14px; }
    .drill-body p { color: var(--cp-text-soft); font-size: 14px; }

    .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; align-items: start; }
    .calc { border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 8px; overflow: hidden; }
    .calc-head { padding: 14px 16px; border-bottom: 1px solid var(--cp-border); background: var(--cp-bg-elevated); }
    .calc-head h3 { margin: 0 0 4px; font-size: 16px; }
    .calc-head p { margin: 0; color: var(--cp-text-muted); font-size: 12.5px; }
    .calc-body { padding: 14px 16px; display: grid; gap: 10px; }
    .field { display: grid; gap: 4px; }
    .field label { font-size: 12px; color: var(--cp-text-muted); font-weight: 650; }
    .field input, .field select {
      width: 100%; min-height: 42px; border: 1px solid var(--cp-border); border-radius: 7px;
      background: var(--cp-surface); color: var(--cp-text); padding: 8px 10px; font-variant-numeric: tabular-nums;
    }
    .field-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
    .calc-out { border-top: 1px solid var(--cp-border); background: var(--cp-bg-elevated); padding: 14px 16px; display: grid; gap: 8px; }
    .out-line { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 13.5px; }
    .out-line span:first-child { color: var(--cp-text-muted); min-width: 0; }
    .out-line span:last-child { font: 700 14px Consolas, "Courier New", Courier, monospace; font-variant-numeric: tabular-nums; text-align: right; }
    .out-line.hero span:last-child { font-size: 19px; color: var(--cp-accent); }
    .calc-note { padding: 0 16px 14px; color: var(--cp-text-muted); font-size: 12px; }

    .empty-state { max-width: 520px; margin: 72px auto; text-align: center; }
    .empty-state h2 { font-size: 30px; }
    .empty-state p { color: var(--cp-text-muted); }

    .dialog-backdrop { position: fixed; inset: 0; z-index: 100; display: none; place-items: start center; padding: 8vh 16px 16px; background: var(--cp-overlay); backdrop-filter: blur(6px); }
    .dialog-backdrop.open { display: grid; }
    .search-dialog { width: min(720px, 100%); max-height: 78vh; overflow: hidden; background: var(--cp-panel-strong); border: 1px solid var(--cp-border-strong); border-radius: 10px; box-shadow: var(--cp-shadow); display: flex; flex-direction: column; }
    .search-input { width: 100%; border: 0; border-bottom: 1px solid var(--cp-border); background: transparent; color: var(--cp-text); padding: 18px; font-size: 17px; outline: 0; }
    .search-results { overflow-y: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
    .search-result { width: 100%; border: 0; background: transparent; padding: 11px 12px; border-radius: 7px; text-align: left; cursor: pointer; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; color: inherit; }
    .search-result:hover, .search-result.selected { background: var(--cp-accent-soft); }
    .search-result strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-result small { color: var(--cp-text-muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .result-kind { color: var(--cp-accent); font: 10px Consolas, "Courier New", Courier, monospace; text-transform: uppercase; }
    .search-help { padding: 10px 16px; border-top: 1px solid var(--cp-border); color: var(--cp-text-muted); font-size: 11px; }

    .toast { position: fixed; z-index: 120; right: 20px; bottom: 20px; background: var(--cp-text); color: var(--cp-bg); border-radius: 8px; padding: 10px 14px; transform: translateY(90px); opacity: 0; transition: .25s ease; pointer-events: none; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .scrim { position: fixed; inset: 0; z-index: 75; background: rgba(0,0,0,.4); display: none; }
    .scrim.open { display: block; }
    .mobile-nav { display: none; }

    .prev-next { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--cp-border); }
    .pn { border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 8px; padding: 14px; cursor: pointer; text-align: left; color: inherit; min-width: 0; }
    .pn:hover { border-color: var(--cp-border-strong); }
    .pn small { color: var(--cp-text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .pn strong { display: block; margin-top: 4px; font-size: 14px; overflow-wrap: break-word; }
    .pn.next { text-align: right; }
    .pn:disabled { opacity: .4; cursor: not-allowed; }

    @media (max-width: 980px) {
      .app-shell { grid-template-columns: minmax(0,1fr); }
      .sidebar { position: fixed; z-index: 80; left: 0; width: 282px; transform: translateX(-101%); transition: transform .25s ease; box-shadow: var(--cp-shadow); }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu { display: grid; }
      .main { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
      .topbar { min-height: 60px; }
      .detail-layout { grid-template-columns: minmax(0, 1fr); gap: 24px; }
      .side-panel { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mobile-nav {
        position: fixed; z-index: 70; left: 0; right: 0; bottom: 0;
        display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
        padding: 5px 4px calc(5px + env(safe-area-inset-bottom));
        background: var(--cp-panel-strong); border-top: 1px solid var(--cp-border); backdrop-filter: blur(16px);
      }
      .mobile-nav button {
        min-width: 0; min-height: 52px; border: 0; border-radius: 7px; background: transparent;
        color: var(--cp-text-muted); cursor: pointer; display: grid; place-items: center; align-content: center;
        gap: 2px; font-size: 10px; line-height: 1.1; padding: 2px;
      }
      .mobile-nav button span:first-child { font: 700 16px Consolas, "Courier New", Courier, monospace; }
      .mobile-nav button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
      .mobile-nav button.active { color: var(--cp-accent); background: var(--cp-accent-soft); font-weight: 800; }
    }
    @media (max-width: 640px) {
      body { font-size: 15px; }
      .view { padding: 26px 16px 48px; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0,1fr)); margin: 26px 0 32px; }
      .stat { padding: 14px 12px; }
      .stat:nth-child(2) { border-right: 0; }
      .stat:nth-child(-n+2) { border-bottom: 1px solid var(--cp-border); }
      .stat:nth-child(3) { padding-left: 0; }
      .card-grid { grid-template-columns: minmax(0,1fr); }
      .module-card { min-height: 0; }
      .detail-header { grid-template-columns: minmax(0,1fr); gap: 16px; padding-bottom: 20px; }
      .detail-actions { width: 100%; }
      .detail-actions .button { flex: 1; }
      .side-panel { grid-template-columns: minmax(0,1fr); }
      .search-button kbd { display: none; }
      .unit-row { grid-template-columns: auto minmax(0, 1fr); padding: 13px 14px; gap: 11px; }
      .unit-meta { grid-column: 2; margin-top: 2px; flex-wrap: wrap; }
      .section-heading { flex-direction: column; align-items: start; gap: 6px; }
      .field-row { grid-template-columns: minmax(0,1fr); }
      .calc-grid { grid-template-columns: minmax(0,1fr); }
      .prev-next { grid-template-columns: minmax(0,1fr); }
      .pn.next { text-align: left; }
      .toast { left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); text-align: center; }
      pre { font-size: 12px; padding: 13px; }
      .formula pre { font-size: 12px; }
      h2 { font-size: 22px; }
      .lede { font-size: 16px; }
      .search-input { font-size: 16px; }
      .drill-head { padding: 13px 14px; gap: 10px; }
      .drill-body { padding: 0 14px 14px; }
    }
    @media (max-width: 370px) {
      .view { padding-inline: 12px; }
      .topbar { padding-inline: 10px; gap: 8px; }
      .mobile-nav button { font-size: 9px; }
      .res-kind { min-width: 44px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
    @media print {
      .sidebar, .topbar, .mobile-nav, .prev-next, .detail-actions { display: none !important; }
      .app-shell { grid-template-columns: minmax(0,1fr); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark">TTFT</div>
        <div>
          <div class="brand-name">Inference Atlas</div>
          <div class="brand-subtitle">LLM serving, end to end</div>
        </div>
      </div>
      <nav class="nav-list" aria-label="Main views">
        <div class="nav-kicker">Study</div>
        <button class="nav-button active" data-view="track"><span>Curriculum</span><span class="count" id="nav-units">0</span></button>
        <button class="nav-button" data-view="library"><span>Paper &amp; resource library</span><span class="count" id="nav-res">0</span></button>
        <button class="nav-button" data-view="reference"><span>Quantitative reference</span><span class="count">22</span></button>
        <button class="nav-button" data-view="calculators"><span>Calculators</span><span class="count" id="nav-calc">7</span></button>
        <button class="nav-button" data-view="drills"><span>Drills &amp; interview set</span><span class="count" id="nav-drills">0</span></button>
        <button class="nav-button" data-view="progress"><span>Progress</span><span class="count" id="nav-done">0</span></button>
      </nav>
      <div>
        <div class="section-label">Modules</div>
        <div class="module-list" id="module-list"></div>
      </div>
      <div class="progress-panel">
        <div class="progress-copy"><span>Units completed</span><span id="progress-label">0 / 0</span></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      </div>
      <div class="sidebar-foot">Progress saves to this browser only.</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menu-button" aria-label="Open navigation" title="Open navigation">&#9776;</button>
        <button class="search-button" id="search-button"><span>Search units, papers, formulas, drills&hellip;</span><kbd>Ctrl K</kbd></button>
        <button class="icon-button" id="theme-button" aria-label="Toggle color theme" title="Toggle color theme">Aa</button>
      </header>
      <div id="view" class="view" tabindex="-1"></div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button class="active" data-mobile-view="track"><span aria-hidden="true">&gt;_</span><span>Track</span></button>
    <button data-mobile-view="library"><span aria-hidden="true">[]</span><span>Library</span></button>
    <button data-mobile-view="reference"><span aria-hidden="true">fx</span><span>Ref</span></button>
    <button data-mobile-view="calculators"><span aria-hidden="true">=</span><span>Calc</span></button>
    <button data-mobile-view="drills"><span aria-hidden="true">?</span><span>Drills</span></button>
  </nav>

  <div class="dialog-backdrop" id="search-backdrop" role="dialog" aria-modal="true" aria-label="Search Inference Atlas">
    <div class="search-dialog">
      <input class="search-input" id="search-input" type="search" placeholder="Try &quot;paged attention&quot;, &quot;roofline&quot;, or &quot;FP8&quot;" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="search-results" id="search-results"></div>
      <div class="search-help">Enter to open &nbsp;/&nbsp; Esc to close &nbsp;/&nbsp; Arrows to navigate</div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/llm-inference/assets/curriculum.js"></script>
  <script src="/llm-inference/assets/library.js"></script>
  <script src="/llm-inference/assets/reference.js"></script>
  <script src="/llm-inference/assets/drills.js"></script>
  <script src="/llm-inference/assets/app.js"></script>
</body>
</html>
